name: Build DucTool EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher_exe.py"
      - "DucTool.spec"
      - "requirements-build.txt"
      - "tools/**"
      - "assets/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-build.txt"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Download official 7zr extractor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile "assets\7zr.exe"
          if (-not (Test-Path "assets\7zr.exe")) {
            throw "Could not download official 7zr.exe"
          }
          $size = (Get-Item "assets\7zr.exe").Length
          if ($size -lt 100000) {
            throw "Downloaded 7zr.exe is unexpectedly small: $size bytes"
          }
          Write-Host "7zr.exe ready: $size bytes"

      - name: Build DucTool.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean DucTool.spec

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DucTool.exe")) {
            throw "dist\DucTool.exe was not created."
          }
          Get-Item "dist\DucTool.exe" | Format-List Name,Length,FullName

      - name: Verify py7zr inside frozen EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD\dist\DucTool.exe" -ArgumentList "--verify-py7zr" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "DucTool.exe was built, but py7zr runtime verification failed."
          }
          Write-Host "py7zr runtime verification passed."

      - name: Verify bundled 7zr extractor
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "$PWD\dist\DucTool.exe" -ArgumentList "--verify-7zr" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "DucTool.exe was built, but bundled 7zr.exe verification failed."
          }
          Write-Host "Bundled 7zr.exe verification passed."

      - name: Upload DucTool.exe
        uses: actions/upload-artifact@v7
        with:
          name: DucTool-Windows
          path: dist/DucTool.exe
          if-no-files-found: error
          retention-days: 30
