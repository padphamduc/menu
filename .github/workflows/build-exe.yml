name: Build DucTool EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher_exe.py"
      - "DucTool.spec"
      - "requirements-build.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build single-file EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean DucTool.spec

      - name: Show output
        shell: pwsh
        run: |
          Get-Item dist\DucTool.exe | Format-List Name,Length,FullName

      - name: Upload DucTool.exe
        uses: actions/upload-artifact@v4
        with:
          name: DucTool-Windows
          path: dist/DucTool.exe
          if-no-files-found: error
          retention-days: 30
