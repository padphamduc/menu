name: Build DucTool EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher_exe.py"
      - "DucTool.spec"
      - "requirements-build.txt"
      - ".github/workflows/build-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-build.txt"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build DucTool.exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean DucTool.spec

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\\DucTool.exe")) {
            throw "dist\\DucTool.exe was not created."
          }
          Get-Item "dist\\DucTool.exe" | Format-List Name,Length,FullName

      - name: Upload DucTool.exe
        uses: actions/upload-artifact@v7
        with:
          name: DucTool-Windows
          path: dist/DucTool.exe
          if-no-files-found: error
          retention-days: 30
